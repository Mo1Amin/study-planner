<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-label="Weekly schedule">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d6efd"/><stop offset="1" stop-color="#4a6bff"/></linearGradient>
  </defs>
  <style>
    .pop { animation: pop 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: .6s; } .p3 { animation-delay: 1.2s; } .p4 { animation-delay: 1.8s; }
    @keyframes pop { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.08); } }
    .check { stroke-dasharray: 40; stroke-dashoffset: 40; animation: check 4s ease-in-out infinite; }
    @keyframes check { 30%, 100% { stroke-dashoffset: 0; } }
  </style>
  <rect x="40" y="40" width="420" height="320" rx="22" fill="url(#card)"/>
  <rect x="40" y="40" width="420" height="70" rx="22" fill="url(#head)"/>
  <rect x="40" y="88" width="420" height="22" fill="url(#head)"/>
  <rect x="110" y="24" width="14" height="40" rx="7" fill="#1e3a8a"/>
  <rect x="376" y="24" width="14" height="40" rx="7" fill="#1e3a8a"/>
  <text x="250" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">جدول الأسبوع</text>
  <g font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="90" y="138">سبت</text><text x="152" y="138">أحد</text><text x="214" y="138">اثنين</text><text x="276" y="138">ثلاثاء</text><text x="338" y="138">أربعاء</text><text x="400" y="138">خميس</text>
  </g>
  <g fill="#e2e8f0">
    <rect x="66" y="152" width="48" height="40" rx="8"/><rect x="128" y="152" width="48" height="40" rx="8"/><rect x="190" y="152" width="48" height="40" rx="8"/><rect x="252" y="152" width="48" height="40" rx="8"/><rect x="314" y="152" width="48" height="40" rx="8"/><rect x="376" y="152" width="48" height="40" rx="8"/>
    <rect x="66" y="204" width="48" height="40" rx="8"/><rect x="128" y="204" width="48" height="40" rx="8"/><rect x="190" y="204" width="48" height="40" rx="8"/><rect x="252" y="204" width="48" height="40" rx="8"/><rect x="314" y="204" width="48" height="40" rx="8"/><rect x="376" y="204" width="48" height="40" rx="8"/>
    <rect x="66" y="256" width="48" height="40" rx="8"/><rect x="128" y="256" width="48" height="40" rx="8"/><rect x="190" y="256" width="48" height="40" rx="8"/><rect x="252" y="256" width="48" height="40" rx="8"/><rect x="314" y="256" width="48" height="40" rx="8"/><rect x="376" y="256" width="48" height="40" rx="8"/>
  </g>
  <rect class="pop" x="128" y="152" width="48" height="40" rx="8" fill="#0d6efd"/>
  <rect class="pop p2" x="252" y="204" width="110" height="40" rx="8" fill="#20c997"/>
  <rect class="pop p3" x="66" y="256" width="48" height="40" rx="8" fill="#ffc107"/>
  <rect class="pop p4" x="314" y="256" width="110" height="40" rx="8" fill="#fd7e14"/>
  <g transform="translate(360 300)">
    <circle r="34" fill="#198754"/>
    <path class="check" d="M-14 0 l9 10 l19 -20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
